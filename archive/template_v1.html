<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#14110f"><title>Light &amp; Glass</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:radial-gradient(120% 80% at 50% 0%,#2a2230 0%,#17131a 55%,#100d0f 100%);color:#efe6d8;font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;overflow:hidden}
#app{max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;align-items:center;padding:14px 14px 10px;position:relative}
h1{font-weight:400;letter-spacing:.18em;font-size:20px;margin:4px 0 2px;color:#f3dfb8;text-transform:uppercase}
.sub{font-size:12px;opacity:.65;letter-spacing:.08em;font-style:italic;margin-bottom:8px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{background:#ffffff0d;border:1px solid #ffffff22;color:#e9dcc6;border-radius:20px;padding:6px 14px;font:inherit;font-size:13px}
.tabs button.on{background:#f3dfb822;border-color:#f3dfb888;color:#fff3dc}
#stage{position:relative;display:grid;gap:6px;grid-template-columns:auto auto;align-items:start}
#frame{position:relative;padding:7px;border-radius:12px 12px 6px 6px;background:linear-gradient(#3a3034,#241d20);box-shadow:0 0 0 2px #4a3d3a,0 14px 40px #0009,inset 0 0 12px #000}
#board{display:grid;gap:3px;background:#0b0a0b;padding:3px;border-radius:6px;position:relative;overflow:hidden;transition:background 1.2s,box-shadow 1.2s}
.cell{position:relative;border-radius:3px;background:radial-gradient(circle at 35% 30%,#2a2a33,#15151b 70%);box-shadow:inset 0 0 6px #000;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;transition:background .35s,box-shadow .35s,transform .15s}
.cell.f{background:var(--c);box-shadow:inset 0 0 8px #0006,inset 2px 2px 5px #ffffff40,0 0 10px var(--c);animation:glow 3.2s ease-in-out infinite;animation-delay:var(--d)}
.cell.f::after{content:"";position:absolute;inset:0;border-radius:3px;background:linear-gradient(135deg,#ffffff38,transparent 40%,transparent 70%,#ffffff14);pointer-events:none}
@keyframes glow{0%,100%{filter:brightness(.92)}50%{filter:brightness(1.12)}}
.cell.clue{font-weight:700;text-shadow:0 1px 3px #000c}
.cell.clue::before{content:"";position:absolute;inset:3px;border:1px solid #fff9;border-radius:50%;pointer-events:none}
.cell.pop{transform:scale(.9)}
.cell.err{animation:err .9s ease 2}
@keyframes err{50%{box-shadow:inset 0 0 0 3px #ff8a7a,0 0 12px #ff8a7a}}
.pips{display:flex;gap:2px;align-items:center}
#rowc{display:grid;gap:3px;padding-top:0;margin-left:10px}#colc{display:grid;gap:3px;padding-top:10px}
#colc .pips{height:var(--s)}#rowc .pips{flex-direction:column;width:var(--s);justify-content:flex-start}
.pip{width:15px;height:15px;border-radius:50%;background:var(--c);font-size:10px;line-height:15px;text-align:center;color:#fff;font-family:system-ui,sans-serif;font-weight:700;text-shadow:0 0 2px #000;box-shadow:0 0 5px var(--c)}
.pip.q{background:none;box-shadow:none;color:#ffffff55;font-size:13px}
.pips.done .pip{opacity:.35}
#palette{display:flex;gap:12px;margin-top:14px;align-items:center}
.sw{width:42px;height:42px;border-radius:50%;background:var(--c);border:2px solid #0006;box-shadow:0 0 12px var(--c),inset 2px 2px 6px #fff5;transition:transform .2s}
.sw.on{transform:scale(1.15);border-color:#fff3dc;box-shadow:0 0 20px var(--c),inset 2px 2px 6px #fff5}
.sw.eraser{background:#1c1b20;box-shadow:inset 0 0 6px #000;display:flex;align-items:center;justify-content:center;font-size:18px;color:#bbb}
#tools{display:flex;gap:10px;margin-top:12px}
#tools button{background:#ffffff0f;border:1px solid #ffffff26;color:#efe6d8;border-radius:12px;padding:9px 14px;font:inherit;font-size:14px}
#msg{height:18px;font-size:13px;opacity:.8;margin-top:8px;font-style:italic;text-align:center}
#help{font-size:11.5px;opacity:.55;text-align:center;margin-top:4px;line-height:1.45;max-width:340px}
/* win */
#beam{position:absolute;inset:-40%;pointer-events:none;opacity:0;background:linear-gradient(115deg,transparent 40%,#fff4c855 48%,#fffbe8aa 50%,#fff4c855 52%,transparent 60%);transform:translateX(-100%)}
.win #beam{animation:beam 2.6s ease-in-out .3s forwards}
@keyframes beam{0%{opacity:1;transform:translateX(-70%)}100%{opacity:0;transform:translateX(70%)}}
.win #board{background:linear-gradient(135deg,#c9a24a,#fff0b8,#a77c2c,#f7dc8c);box-shadow:0 0 30px #f3cf7a88}
.win .cell.f{filter:brightness(1.25) saturate(1.1);animation:none;box-shadow:inset 0 0 6px #0004,inset 2px 2px 6px #fff8,0 0 18px var(--c)}
.win .cell.clue{color:transparent;text-shadow:none}.win .cell.clue::before{display:none}
.win #frame{box-shadow:0 0 0 2px #8a6d3a,0 0 60px #f3cf7a55,0 14px 40px #0009}
#floor{position:absolute;left:0;right:0;bottom:0;height:200px;pointer-events:none;opacity:0;transition:opacity 2.5s 1.2s;background:
 repeating-linear-gradient(90deg,transparent 0 63px,#0007 63px 65px),repeating-linear-gradient(0deg,transparent 0 38px,#0007 38px 40px),linear-gradient(#2a2420,#3b332c);
 -webkit-mask:linear-gradient(transparent,#000 35%);mask:linear-gradient(transparent,#000 35%)}
#proj{position:absolute;left:50%;bottom:10px;width:260px;height:260px;margin-left:-130px;display:grid;gap:4px;transform:perspective(320px) rotateX(64deg) skewX(-14deg);filter:blur(5px);mix-blend-mode:screen;opacity:.85}
#proj div{border-radius:2px}
.win #floor{opacity:1}
#winCard{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;transition:all 1s 2.4s;text-align:center;background:#1a1416cc;border:1px solid #f3dfb855;border-radius:16px;padding:14px 22px;backdrop-filter:blur(4px)}
.win #winCard{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#winCard b{display:block;font-weight:400;font-size:20px;letter-spacing:.12em;color:#ffe7b0}
#winCard button{margin-top:10px;background:#f3dfb822;border:1px solid #f3dfb888;color:#fff3dc;border-radius:20px;padding:7px 16px;font:inherit}
.win #palette,.win #tools,.win #help{opacity:.15;pointer-events:none;transition:opacity 1s}
.dust{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffeebb;opacity:0;pointer-events:none}
.win .dust{animation:dust 6s ease-in-out infinite}
@keyframes dust{0%{opacity:0;transform:translate(0,0)}30%{opacity:.8}100%{opacity:0;transform:translate(30px,-60px)}}
</style></head><body><div id="app">
<h1>Light &amp; Glass</h1><div class="sub" id="lvname"></div>
<div class="tabs"><button data-l="0">Tutorial 5×5</button><button data-l="1">Garden 8×8</button></div>
<div id="stage"><div id="frame"><div id="board"></div><div id="beam"></div></div><div id="colc"></div><div id="rowc"></div><div></div></div>
<div id="palette"></div>
<div id="tools"><button id="undo">↶ Undo</button><button id="check">✦ Check</button><button id="reset">Clear</button></div>
<div id="msg"></div>
<div id="help">Pips: how many of each colour in that row/column (? = hidden).<br>Number in a glass: how many of its 4 neighbours share its colour.<br>Tap to place · tap again or long-press to clear.</div>
<div id="floor"><div id="proj"></div></div>
<div id="winCard"><b>The window glows</b><span id="winTxt" style="font-size:13px;opacity:.8"></span><br><button id="next">Continue</button></div>
</div>
<script>
const LEVELS=__LEVELS__;
let L,lv=0,grid,undo=[],sel=0,won=false,cs;
const $=s=>document.querySelector(s),board=$('#board');
function load(i){lv=i;L=LEVELS[i];won=false;document.getElementById('app').classList.remove('win');undo=[];sel=0;
 grid=L.sol.map(r=>r.map(()=>-1));L.clues.forEach(([r,c])=>grid[r][c]=L.sol[r][c]);
 cs=Math.floor(Math.min(320,Math.min(innerWidth,430)-28-14-20-6-(L.n+1)*3-L.colors.length*17)/L.n);
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.l==i));
 $('#lvname').textContent=L.name;build();render();msg('')}
function isClue(r,c){return L.clues.find(q=>q[0]==r&&q[1]==c)}
function build(){const n=L.n;board.style.gridTemplateColumns=`repeat(${n},${cs}px)`;board.innerHTML='';
 for(let r=0;r<n;r++)for(let c=0;c<n;c++){const d=document.createElement('div');d.className='cell';d.style.height=cs+'px';d.style.setProperty('--d',(-(r*3+c*7)%32/10)+'s');d.dataset.r=r;d.dataset.c=c;const q=isClue(r,c);if(q){d.classList.add('clue');d.textContent=q[2]}bindCell(d);board.appendChild(d)}
 const rc=$('#rowc'),cc=$('#colc');rc.style.setProperty('--s',cs+'px');cc.style.setProperty('--s',cs+'px');
 cc.style.gridTemplateRows=`repeat(${n},${cs}px)`;rc.style.gridTemplateColumns=`repeat(${n},${cs}px)`;
 // rows on the right (colc grid), columns below (rowc grid)
 cc.innerHTML=L.rows.map(x=>pips(x,'r')).join('');rc.innerHTML=L.cols.map(x=>pips(x,'c')).join('');
 $('#palette').innerHTML=L.colors.map((c,i)=>`<div class="sw" data-i="${i}" style="--c:${c}"></div>`).join('')+'<div class="sw eraser" data-i="-1">✕</div>';
 document.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{sel=+s.dataset.i;render()});
 $('#proj').style.gridTemplateColumns=`repeat(${n},1fr)`;$('#proj').innerHTML=L.sol.flat().map(k=>`<div style="background:${L.colors[k]}"></div>`).join('')}
function pips(x){if(!x)return '<div class="pips"><div class="pip q">?</div></div>';return '<div class="pips">'+x.map((v,k)=>v?`<div class="pip" style="--c:${L.colors[k]}">${v}</div>`:'').join('')+'</div>'}
function bindCell(d){let t,long;
 d.addEventListener('pointerdown',e=>{e.preventDefault();long=false;t=setTimeout(()=>{long=true;set(+d.dataset.r,+d.dataset.c,-1,true);navigator.vibrate&&navigator.vibrate(15)},420)});
 d.addEventListener('pointerup',()=>{clearTimeout(t);if(!long){const r=+d.dataset.r,c=+d.dataset.c;set(r,c,grid[r][c]==sel?-1:sel)}});
 d.addEventListener('pointerleave',()=>clearTimeout(t));d.addEventListener('contextmenu',e=>e.preventDefault())}
function set(r,c,v){if(won||isClue(r,c)||grid[r][c]==v)return;undo.push([r,c,grid[r][c]]);grid[r][c]=v;tone(v);render();const el=board.children[r*L.n+c];el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),150);checkWin()}
function render(){board.querySelectorAll('.cell').forEach(d=>{const v=grid[d.dataset.r][d.dataset.c];d.classList.toggle('f',v>=0);d.style.setProperty('--c',v>=0?L.colors[v]:'transparent')});
 document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',+s.dataset.i==sel));
 const n=L.n,cnt=a=>L.colors.map((_,k)=>a.filter(v=>v==k).length),eq=(a,b)=>b&&a.every((v,i)=>v==b[i]);
 [...$('#colc').children].forEach((p,r)=>p.classList.toggle('done',eq(cnt(grid[r]),L.rows[r])));
 [...$('#rowc').children].forEach((p,c)=>p.classList.toggle('done',eq(cnt(grid.map(x=>x[c])),L.cols[c])))}
function msg(t){$('#msg').textContent=t}
function checkWin(){if(grid.every((row,r)=>row.every((v,c)=>v==L.sol[r][c])))win()}
$('#undo').onclick=()=>{const u=undo.pop();if(!u||won)return;grid[u[0]][u[1]]=u[2];render()};
$('#reset').onclick=()=>{if(won)return;grid.forEach((row,r)=>row.forEach((v,c)=>{if(!isClue(r,c)&&v>=0){undo.push([r,c,v]);row[c]=-1}}));render()};
$('#check').onclick=()=>{let e=0;board.querySelectorAll('.cell').forEach(d=>{const v=grid[d.dataset.r][d.dataset.c];if(v>=0&&v!=L.sol[d.dataset.r][d.dataset.c]){e++;d.classList.remove('err');void d.offsetWidth;d.classList.add('err')}});
 const empty=grid.flat().filter(v=>v<0).length;msg(e?`${e} piece${e>1?'s':''} of glass don’t belong — they’re shimmering.`:`All good so far ✦ ${empty} panes left.`)};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>load(+b.dataset.l));
$('#next').onclick=()=>load(lv?0:1);
let ac;function ctx(){if(!ac)try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}return ac}
function note(f,t0,dur,vol){const a=ctx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol,a.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+dur);o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+.05)}
function tone(v){if(v>=0)note([523,587,659,784][v]||523,0,.25,.04)}
function win(){won=true;msg('');const app=$('#app');app.classList.add('win');
 $('#winTxt').textContent=L.name+' — solved by light alone.';
 [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{note(f,.3+i*.18,2.6,.07);note(f*2,.3+i*.18,1.2,.015)});
 for(let i=0;i<14;i++){const d=document.createElement('div');d.className='dust';d.style.left=(20+Math.random()*60)+'%';d.style.top=(15+Math.random()*60)+'%';d.style.animationDelay=(Math.random()*5)+'s';app.appendChild(d)}}
// test hooks: #solve or #lvl=0
const h=location.hash;load(/lvl=0/.test(h)?0:1);
if(/solve/.test(h)){L.sol.forEach((row,r)=>row.forEach((v,c)=>{if(!isClue(r,c)){grid[r][c]=v}}));render();setTimeout(checkWin,200)}
</script></body></html>
